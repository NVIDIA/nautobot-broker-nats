[project]
authors     = [
    {name = "Eric Busto", email =  "ebusto@nvidia.com"},
    {name = "Kyle Fischer", email =  "kfischer@nvidia.com"}
]
dependencies = [
    "dictdiffer>=0.9.0,<0.10.0",
    "djlint>=1.36.4,<2.0.0",
    "nats-py>=2.10.0,<3.0.0",
    "nkeys>=0.2.1,<0.3.0",
    "orjson>=3.10.15,<4.0.0",
    "shell>=1.0.1,<2.0.0",
]
description     = "Publish changes to NATS"
name            = "nautobot-broker-nats"
readme          = "README.md"
requires-python = ">=3.11,<4.0"
version         = "1.2.4"

[dependency-groups]
dev = [
    "pylint>=3.3,<4.0",
    "pylint-django>=2.6,<3.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<0.10",
]

[build-system]
build-backend = "uv_build"
requires      = ["uv_build>=0.11.18,<0.12"]

[tool.uv.build-backend]
module-name = "nautobot_broker_nats"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
analyse-fallback-blocks = "no"
ignore=".venv"
jobs = 0
# Include the pylint_django plugin to avoid spurious warnings about Django patterns
# Include pylint_nautobot to prep for Nautobot v2 migration
load-plugins="pylint_django"
django-settings-module="nautobot_consumables.config"
py-version = "3.11"


[tool.pylint.basic]
class-attribute-naming-style = "snake_case"
good-names = ["i", "j", "k", "q", "v", "ex", "id", "pk", "Run", "logger", "_"]
# No docstrings required for private methods (Pylint default), or for test_ functions, or for inner Meta classes.
no-docstring-rgx="^(_|test_|Meta$)"
property-classes = ["abc.abstractproperty", "property"]
# Maintain the default behavior, disallowing TypeAliases that start or end with "T" or "Type",
# but allow CONSTANT names in addition to PascalCase.
# https://pylint.readthedocs.io/en/stable/user_guide/messages/convention/invalid-name.html#predefined-naming-patterns
typealias-rgx="^(?!T)[A-Z][A-Za-z]{2,}(?<!Type)(?<!T)$"

[tool.pylint.format]
ignore-long-lines = "^\\s*(# )?(from \\S+)?\\s?(import\\s)?(.+)?<?(http)?s?(://\\S+)?>?"

[tool.pylint.imports]
allow-wildcard-with-all = "no"

[tool.pylint.messages_control]
# Line length is checked by flake8 with flake8-bugbear
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "line-too-long",
    "duplicate-code",
    "too-many-ancestors",
    "fixme",
]

[tool.pylint.miscellaneous]
# Don't flag TODO as a failure, let us commit with things that still need to be done in the code
notes = """,
    FIXME,
    XXX,
    """

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "D",  # pydocstyle
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "S",  # bandit
    "W",  # pycodestyle warning
]
ignore = [
    "D100", # D100 enforces docstrings for public methods, including our log file.
    "D105", # D105 enforces docstrings for magic methods, e.g. __str__(). It seems unnecessary.
    "D107", # Missing docstring in `__init__`

    # warning: `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible.
    "D203", # 1 blank line required before class docstring

    # D212 is enabled by default in google convention, and complains if we have a docstring like:
    # """
    # My docstring is on the line after the opening quotes instead of on the same line as them.
    # """
    # We've discussed and concluded that we consider this to be a valid style choice.
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line

    # Produces a lot of issues in the current codebase.
    "D401", # First line of docstring should be in imperative mood
    "D407", # Missing dashed underline after section
    "D416", # Section name ends in colon
    "E501", # Line too long
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pycodestyle]
# Combine line-length and max-line-length to emulate flake8-bugbear's B950 rule.
# The formatter uses line-length, but rule E501 won't complain until a line hits 111.
max-line-length = 110

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",
    "S101",
]
"nautobot_consumables/**/__init__.py" = [
    "D",
]
"nautobot_consumables/migrations/*" = [
    "D",
]
"nautobot_consumables/tests/*" = [
    "D",
    "S"
]

[tool.djlint]
profile = "django"
ignore = "H021,T002"
