name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pylint
          pip install poetry
          poetry install --no-interaction

      - name: Check formatting with ruff
        run: ruff format --check nautobot_broker_nats/

      - name: Lint with ruff
        run: ruff check nautobot_broker_nats/

      # TODO: Enable pylint after inital merge into github
      # - name: Lint with pylint
      #   run: pylint nautobot_broker_nats/
